# Stack Synthra di esempio per produzione / staging Docker.
#
# Prima copia e compila gli env pubblici dei build-arg di Next:
#   export NEXT_PUBLIC_API_URL=https://tuodominio.com/api
#   export NEXT_PUBLIC_WS_URL=https://api.tuodominio.com
# (Nel browser deve risolvere l URL pubblico dell API, non localhost.)
#
# Poi:
#   docker compose -f docker-compose.prod.yml up --build -d
#
# Variabili nel file `.env` in root (Compose: --env-file .env), vedi `.env.prod.example`.
#   JWT_SECRET=<lungo-secret>
#   POSTGRES_PASSWORD=<sicura>
#
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-changeme_pg_password}
      POSTGRES_DB: livefy
    volumes:
      - synthra_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d livefy"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: deploy/Dockerfile.api
    restart: unless-stopped
    ports:
      - "4000:4000"
    environment:
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme_pg_password}@postgres:5432/livefy
      DIRECT_URL: postgresql://postgres:${POSTGRES_PASSWORD:-changeme_pg_password}@postgres:5432/livefy
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET_obbligatorio}
      PORT: "4000"
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:3000}
      SOCKET_CORS_ORIGIN: ${SOCKET_CORS_ORIGIN:-http://localhost:3000}
      PLATFORM_TIP_FEE_PERCENT: ${PLATFORM_TIP_FEE_PERCENT:-30}
      TOKEN_EUR_RATE: ${TOKEN_EUR_RATE:-0.05}
      MODEL_PAYOUT_WITHHOLD_PERCENT: ${MODEL_PAYOUT_WITHHOLD_PERCENT:-40}
      OWNER_HUB_URL: ${OWNER_HUB_URL:-}
      OWNER_INGEST_TOKEN: ${OWNER_INGEST_TOKEN:-}
      OWNER_PLATFORM_ID: ${OWNER_PLATFORM_ID:-livefy}
      OWNER_PLATFORM_NAME: ${OWNER_PLATFORM_NAME:-Livefy}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      REDIS_URL: ${REDIS_URL:-}
      REVOLUT_API_BASE_URL: ${REVOLUT_API_BASE_URL:-https://merchant.revolut.com}
      REVOLUT_API_KEY: ${REVOLUT_API_KEY:-}
      REVOLUT_API_VERSION: ${REVOLUT_API_VERSION:-2024-09-01}
      MIN_PAYOUT_TOKENS: ${MIN_PAYOUT_TOKENS:-}
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:4000/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-http://localhost:4000}
    restart: unless-stopped
    ports:
      - "3000:3000"
    depends_on:
      - api

  owner_hub_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${HUB_POSTGRES_PASSWORD:-changeme_hub_pg}
      POSTGRES_DB: owner_hub
    volumes:
      - hub_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d owner_hub"]
      interval: 5s
      timeout: 5s
      retries: 10

  owner_hub:
    build:
      context: .
      dockerfile: deploy/Dockerfile.hub
      args:
        OWNER_HUB_URL: ${OWNER_HUB_URL:-http://localhost:3100}
    restart: unless-stopped
    ports:
      - "3100:3100"
    environment:
      NODE_ENV: production
      OWNER_HUB_DATABASE_URL: postgresql://postgres:${HUB_POSTGRES_PASSWORD:-changeme_hub_pg}@owner_hub_postgres:5432/owner_hub
      OWNER_INGEST_TOKEN: ${OWNER_INGEST_TOKEN:?OWNER_INGEST_TOKEN_obbligatorio}
      OWNER_ALLOWED_EMAILS: ${OWNER_ALLOWED_EMAILS:?OWNER_ALLOWED_EMAILS_obbligatorio}
      OWNER_HUB_SECRET: ${OWNER_HUB_SECRET:?OWNER_HUB_SECRET_obbligatorio}
      OWNER_HUB_URL: ${OWNER_HUB_URL:-http://localhost:3100}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    depends_on:
      owner_hub_postgres:
        condition: service_healthy

volumes:
  synthra_pgdata:
  hub_pgdata:
